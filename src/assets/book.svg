<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E9A8"/>
      <stop offset="40%" stop-color="#E0C067"/>
      <stop offset="100%" stop-color="#A66B1F"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C6"/>
      <stop offset="100%" stop-color="#D3A441"/>
    </linearGradient>

    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="100%" stop-color="#E9DFC0"/>
    </linearGradient>
  </defs>

  <!-- Outer mystic circle -->
  <circle
    cx="48"
    cy="48"
    r="42"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2"
  />

  <!-- Rune marks -->
  <path
    d="M25 30 L29 26 L33 30 L29 34 Z"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1"
  />

  <path
    d="M63 26 H71 V34 H63"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1"
  />

  <!-- Left page -->
  <path
    d="
      M20 24
      Q34 20 46 30
      V72
      Q34 62 20 66
      Z
    "
    fill="url(#pageGlow)"
    stroke="url(#gold)"
    stroke-width="2.5"
  />

  <!-- Right page -->
  <path
    d="
      M76 24
      Q62 20 50 30
      V72
      Q62 62 76 66
      Z
    "
    fill="url(#pageGlow)"
    stroke="url(#gold)"
    stroke-width="2.5"
  />

  <!-- Center spine -->
  <path
    d="M48 28 V74"
    stroke="url(#gold)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Decorative lines -->
  <line
    x1="28"
    y1="38"
    x2="40"
    y2="38"
    stroke="url(#goldLight)"
    stroke-width="1.5"
  />

  <line
    x1="28"
    y1="46"
    x2="40"
    y2="46"
    stroke="url(#goldLight)"
    stroke-width="1.5"
  />

  <line
    x1="56"
    y1="38"
    x2="68"
    y2="38"
    stroke="url(#goldLight)"
    stroke-width="1.5"
  />

  <line
    x1="56"
    y1="46"
    x2="68"
    y2="46"
    stroke="url(#goldLight)"
    stroke-width="1.5"
  />

  <!-- Magic sparkle -->
  <path
    d="M48 14 L50 20 L56 22 L50 24 L48 30 L46 24 L40 22 L46 20 Z"
    fill="url(#gold)"
  />

  <!-- Bottom crystal -->
  <path
    d="M48 78 L44 86 L48 92 L52 86 Z"
    fill="url(#gold)"
    stroke="#F7E6A0"
    stroke-width="1"
  />
</svg>