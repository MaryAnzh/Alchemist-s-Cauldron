<svg width="140" height="200" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Внешний контур банки -->
    <linearGradient id="jarStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6ff"/>
      <stop offset="50%" stop-color="#9fb4ff"/>
      <stop offset="100%" stop-color="#5a6ccf"/>
    </linearGradient>

    <!-- Внутренний стеклянный контур -->
    <linearGradient id="glassInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="40%" stop-color="rgba(200,220,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(120,150,220,0.1)"/>
    </linearGradient>

    <!-- Блик -->
    <linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Горлышко: внешняя обводка -->
    <linearGradient id="neckOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf0ff"/>
      <stop offset="100%" stop-color="#7c8fd8"/>
    </linearGradient>

    <!-- Горлышко: внутренняя обводка -->
    <linearGradient id="neckInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0c2ff"/>
    </linearGradient>

    <!-- Крышка -->
    <linearGradient id="capGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d37a"/>
      <stop offset="50%" stop-color="#d9a84f"/>
      <stop offset="100%" stop-color="#b07a2f"/>
    </linearGradient>

    <!-- Блик на крышке -->
    <linearGradient id="capHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Крышка -->
  <rect x="40" y="18" width="60" height="20" rx="6" fill="url(#capGradient)" />
  <rect x="42" y="20" width="56" height="6" rx="3" fill="url(#capHighlight)" />

  <!-- Горлышко: внешняя обводка -->
  <path
    d="M45 40
       Q45 30 55 28
       L85 28
       Q95 30 95 40
       L95 55
       Q95 58 92 60
       L48 60
       Q45 58 45 55
       Z"
    fill="none"
    stroke="url(#neckOuter)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Горлышко: внутренняя обводка -->
  <path
    d="M50 40
       Q50 34 58 32
       L82 32
       Q90 34 90 40
       L90 54
       Q90 55 88 57
       L52 57
       Q50 55 50 54
       Z"
    fill="none"
    stroke="url(#neckInner)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Контур банки -->
  <path
    d="M35 60
       Q30 75 30 95
       L30 150
       Q30 170 45 180
       Q70 190 95 180
       Q110 170 110 150
       L110 95
       Q110 75 105 60
       Z"
    fill="none"
    stroke="url(#jarStroke)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Внутренний стеклянный контур -->
  <path
    d="M40 65
       Q35 80 35 95
       L35 145
       Q35 160 48 168
       Q70 178 92 168
       Q105 160 105 145
       L105 95
       Q105 80 100 65
       Z"
    fill="none"
    stroke="url(#glassInner)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Блик -->
  <path
    d="M45 75
       Q40 90 42 110
       Q45 120 55 130"
    fill="none"
    stroke="url(#glassHighlight)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Блёстки внутри -->
  <g fill="white" opacity="0.7">
    <circle cx="55" cy="120" r="2"/>
    <circle cx="75" cy="130" r="1.5"/>
    <circle cx="65" cy="110" r="1"/>
    <circle cx="85" cy="140" r="2.2"/>
    <circle cx="50" cy="150" r="1.3"/>
    <circle cx="90" cy="115" r="1.8"/>
    <circle cx="70" cy="155" r="1"/>
    <circle cx="60" cy="135" r="2.5"/>
  </g>

  <!-- Тусклые блёстки -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="80" cy="125" r="1"/>
    <circle cx="55" cy="140" r="1.2"/>
    <circle cx="95" cy="150" r="1"/>
    <circle cx="45" cy="130" r="0.8"/>
  </g>
</svg>
