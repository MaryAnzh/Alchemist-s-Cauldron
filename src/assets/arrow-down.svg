<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E9A8"/>
      <stop offset="40%" stop-color="#E0C067"/>
      <stop offset="100%" stop-color="#A66B1F"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C6"/>
      <stop offset="100%" stop-color="#D3A441"/>
    </linearGradient>
  </defs>

  <!-- Outer mystic circle -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- Double chevron -->
  <path
    d="M30 38 L48 56 L66 38"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M30 50 L48 68 L66 50"
    fill="none"
    stroke="url(#goldLight)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>